<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>月度活动计划 · 明细</title><style>
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#0a0e14;color:#e2e8f0;margin:0;padding:20px}
h1{font-size:20px;color:#f1f5f9}.kpi{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}
.kpi .box{flex:1;min-width:150px;background:#1a2332;padding:14px;border-radius:8px;text-align:center}
.kpi .box .v{font-size:18px;font-weight:700;color:#10b981}.kpi .box .k{font-size:12px;color:#94a3b8;margin-top:4px}
.tbl-wrap{overflow:auto;max-height:70vh}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;background:#1a2332;border-radius:8px;font-size:13px;min-width:1000px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #334155;white-space:nowrap}
thead th{background:#1F4E78;color:#fff;font-weight:600;position:-webkit-sticky;position:sticky;top:0;z-index:20;cursor:pointer;user-select:none}
thead th:hover{background:#2b6cb0}
thead th .arrow{font-size:10px;color:#93c5fd;margin-left:4px}
td.num{font-family:Menlo,monospace;font-size:12px;color:#94a3b8}
td.amt{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{position:-webkit-sticky;position:sticky;bottom:0;z-index:15;background:#1e3a8a;color:#fff;font-weight:700;border-top:2px solid #3b82f6;border-bottom:none}
tr:hover{background:#0f172a}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag.lh{background:#1e3a8a;color:#93c5fd}.tag.dd{background:#065f46;color:#6ee7b7}
.month-nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.month-nav button{background:#1a2332;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
.month-nav button.active{background:#1e3a8a;border-color:#3b82f6;color:#fff}
.meta{color:#94a3b8;font-size:12px;margin-bottom:8px}
a{color:#3b82f6;text-decoration:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filters select{background:#1a2332;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px 10px;font-size:13px}
.filters select:hover{border-color:#3b82f6}
@media(max-width:767px){body{padding:12px}.kpi .box{min-width:130px}th,td{font-size:12px;padding:6px 8px}}

.back-home{display:inline-block;margin-bottom:14px;background:#1a2332;color:#e2e8f0;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13px;border:1px solid #334155;transition:all .15s}
.back-home:hover{background:#1e3a8a;border-color:#3b82f6;color:#fff}
@media(max-width:767px){.back-home{padding:6px 10px;font-size:12px}}
</style></head><body><!-- 🔄 刷新按钮: 与返回主页面 .back-home 同风格 (2026-08-14 老板要求统一) -->
<div style="position:fixed;top:12px;right:12px;z-index:9999">
  <button id="refresh-btn" onclick="refreshDetail()" title="刷新本页"
    style="display:inline-block;background:#1a2332;color:#e2e8f0;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13px;border:1px solid #334155;transition:all .15s;cursor:pointer;font-family:inherit">🔄 刷新</button>
  <span id="refresh-status" style="display:none;margin-left:8px;background:#1a2332;color:#94a3b8;border:1px solid #29303d;border-radius:8px;padding:6px 10px;font-size:12px"></span>
</div>
<script>

// 2026-08-14 老板: 顶部 KPI 动态统计 (全局函数, 供 renderFilters/renderTable 调用)
function renderKpi(list) {
  const lh = list.filter(p => p.type === '联合活动').length;
  const dd = list.filter(p => p.type === '单店活动').length;
  const amt = list.reduce((a, p) => a + (p.amt || 0), 0);
  const m = (typeof filters !== 'undefined' && filters.month) || 'all';
  const cur = m === 'all' ? '全部' : (m + '月');
  document.getElementById('kpi').innerHTML = `
    <div class="box"><div class="v">${list.length} 个</div><div class="k">${cur}项目</div></div>
    <div class="box"><div class="v">${lh} 个</div><div class="k">联合活动</div></div>
    <div class="box"><div class="v">${dd} 个</div><div class="k">单店活动</div></div>
    <div class="box"><div class="v">¥${amt.toLocaleString()}</div><div class="k">总金额</div></div>`;
}

const PAGE_KEY = 'tencent_plan';
async function refreshDetail(){
  const btn = document.getElementById('refresh-btn');
  const st = document.getElementById('refresh-status');
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  if (st) { st.style.display = 'inline-block'; st.textContent = '正在刷新...'; }
  const host = window.location.host;
  const isNgrok = host.includes('ngrok');
  const isPages = host.includes('github.io');
  if (isPages) {
    if (st) { st.style.display = 'inline-block'; st.textContent = '⚠️ Pages 静态,只显示最近快照'; }
    alert('你正在 Pages 入口 (jayyangstore.github.io)\n\nPages 是静态托管,不能实时刷新.\n\n如需实时刷新请去 ngrok 入口:\nhttps://alone-chowder-wired.ngrok-free.dev/workbench/\n\n点确定后刷新当前页(只显示最近一次 build 快照)');
    setTimeout(() => location.reload(), 1000);
    return;
  }
  if (isNgrok) {
    try {
      const r = await fetch('/__refresh_detail?page=' + PAGE_KEY, {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const t = await r.text();
      if (st) { st.style.display = 'inline-block'; st.textContent = '✅ ' + t.split('\n').join(' | '); }
      setTimeout(() => location.reload(), 800);
    } catch(e) {
      if (st) { st.style.display = 'inline-block'; st.textContent = '❌ ' + e.message; }
      if (btn) { btn.disabled = false; btn.textContent = '🔄 刷新'; }
      alert('刷新失败: ' + e.message);
    }
  }
}
</script><a class="back-home" href="./">← 返回主页面</a>
<h1>📋 月度活动计划（腾讯文档在线表）</h1><div class="meta" id="meta">加载中…</div>
<div class="kpi" id="kpi"></div>
<div class="month-nav" id="monthNav"></div>
<div class="filters" id="filters"></div>
<div class="tbl-wrap"><table id="tbl">
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
<tfoot id="tfoot"></tfoot>
</table></div>
<script>
let D = null, curMonth = null, filters = {type: '', cat: ''};

fetch('data/tencent_plan_detail.json', {cache:'no-store'}).then(r=>r.json()).then(d => {
  D = d; render();
}).catch(e => {
  document.getElementById('meta').textContent = '⚠️ 数据加载失败: ' + e.message;
});

function render() {
  document.getElementById('meta').innerHTML =
    `数据来源：腾讯文档在线表 · 更新于 ${D.generated} · <a href="${D.url}" target="_blank">打开原表 ↗</a>`;

  // 初始加载: 默认全部月份 (renderKpi 定义在全局)
  renderKpi(D.all_projects);

  const months = [...new Set(D.all_projects.map(p => p.month))].sort();
  document.getElementById('monthNav').innerHTML =
    `<button data-m="all" class="${curMonth === 'all' ? 'active' : ''}">全部</button>` +
    months.map(m => `<button data-m="${m}" class="${curMonth === m ? 'active' : ''}">${parseInt(m)}月</button>`).join('');
  document.querySelectorAll('.month-nav button').forEach(btn => {
    btn.onclick = () => { curMonth = btn.dataset.m; renderFilters(); renderTable(); document.querySelectorAll('.month-nav button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); };
  });

  renderFilters();
  renderTable();
}

function renderFilters() {
  const month = curMonth || D.month;
  const list = month === 'all' ? D.all_projects : D.all_projects.filter(p => p.month === month);
  renderKpi(list);  // 2026-08-14: 筛选变化时同步刷新顶部 KPI
  const types = [...new Set(list.map(p => p.type))];
  const cats = [...new Set(list.map(p => p.cat).filter(Boolean))];
  document.getElementById('filters').innerHTML = `
    <select id="fType" onchange="filters.type=this.value;renderTable()">
      <option value="">类型：全部</option>
      ${types.map(t => `<option value="${t}">${t}</option>`).join('')}
    </select>
    <select id="fCat" onchange="filters.cat=this.value;renderTable()">
      <option value="">分类：全部</option>
      ${cats.map(c => `<option value="${c}">${c}</option>`).join('')}
    </select>`;
}

function getList() {
  const month = curMonth || D.month;
  let list;
  if (month === 'all') {
    // 全部项目：按月份倒序（08 最先，03 最后），同月内保持原顺序
    list = [...D.all_projects].sort((a, b) => (b.month || '').localeCompare(a.month || ''));
  } else {
    list = D.all_projects.filter(p => p.month === month);
  }
  if (filters.type) list = list.filter(p => p.type === filters.type);
  if (filters.cat) list = list.filter(p => p.cat === filters.cat);
  return list;
}

let sortKey = '', sortDir = 1;
function sortBy(key) {
  if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
  renderTable();
}

function renderTable() {
  let list = getList();
  if (sortKey) {
    list = [...list].sort((a, b) => {
      const av = sortKey === 'amt' || sortKey === 'lead' || sortKey === 'ddtarget' ? a[sortKey] : String(a[sortKey] || '');
      const bv = sortKey === 'amt' || sortKey === 'lead' || sortKey === 'ddtarget' ? b[sortKey] : String(b[sortKey] || '');
      if (typeof av === 'number') return (av - bv) * sortDir;
      return av.localeCompare(bv, 'zh') * sortDir;
    });
  }
  const arrow = (k) => sortKey === k ? (sortDir === 1 ? '▲' : '▼') : '';
  document.getElementById('thead').innerHTML = `
    <tr>
      <th onclick="sortBy('num')">序号 ${arrow('num')}</th>
      <th onclick="sortBy('num')">活动编号 ${arrow('num')}</th>
      <th onclick="sortBy('type')">类型 ${arrow('type')}</th>
      <th onclick="sortBy('cat')">分类 ${arrow('cat')}</th>
      <th onclick="sortBy('name')">活动名称 ${arrow('name')}</th>
      <th onclick="sortBy('sdate')">开始 ${arrow('sdate')}</th>
      <th onclick="sortBy('edate')">结束 ${arrow('edate')}</th>
      <th style="text-align:right" onclick="sortBy('lead')">有效线索 ${arrow('lead')}</th>
      <th style="text-align:right" onclick="sortBy('ddtarget')">大定目标 ${arrow('ddtarget')}</th>
      <th style="text-align:right" onclick="sortBy('amt')">区域支持金额 ${arrow('amt')}</th>
    </tr>`;

  document.getElementById('tbody').innerHTML = list.map((p, i) => `
    <tr>
      <td>${i+1}</td>
      <td class="num">${p.num.replace('SAR2-2026', '')}</td>
      <td><span class="tag ${p.type === '联合活动' ? 'lh' : 'dd'}">${p.type === '联合活动' ? '联合' : '单店'}</span></td>
      <td>${p.cat}</td>
      <td>${p.name}</td>
      <td>${p.sdate}</td>
      <td>${p.edate}</td>
      <td class="amt">${p.lead > 0 ? p.lead.toLocaleString() : '—'}</td>
      <td class="amt">${p.ddtarget > 0 ? p.ddtarget.toLocaleString() : '—'}</td>
      <td class="amt">${p.amt > 0 ? '¥' + p.amt.toLocaleString() : '—'}</td>
    </tr>`).join('') || '<tr><td colspan="10" style="text-align:center;color:#94a3b8">该月暂无项目</td></tr>';

  // 合计行（动态求和，随筛选/月份变化）
  const sumLead = list.reduce((a, p) => a + (p.lead || 0), 0);
  const sumDd = list.reduce((a, p) => a + (p.ddtarget || 0), 0);
  const sumAmt = list.reduce((a, p) => a + (p.amt || 0), 0);
  document.getElementById('tfoot').innerHTML = `
    <tr>
      <td colspan="7" style="text-align:right">合计（${list.length} 个）</td>
      <td class="amt">${sumLead > 0 ? sumLead.toLocaleString() : '—'}</td>
      <td class="amt">${sumDd > 0 ? sumDd.toLocaleString() : '—'}</td>
      <td class="amt">¥${sumAmt.toLocaleString()}</td>
    </tr>`;
}
</script>
</body></html>
