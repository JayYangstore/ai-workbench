<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Jay · AI 工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0e14;
    color: #e2e8f0;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
    padding-bottom: 60px;
  }
  a { color: #3b82f6; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ============ Password Gate ============ */
  #gate {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0a0e14 0%, #1a2332 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  #gate .card {
    background: #1a2332;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px 32px;
    width: 90%; max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #gate h1 { font-size: 22px; margin-bottom: 8px; color: #f1f5f9; }
  #gate p { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 12px 14px;
    background: #0f172a; border: 1px solid #334155;
    border-radius: 8px; color: #e2e8f0; font-size: 15px;
    margin-bottom: 12px; font-family: inherit;
  }
  #gate input:focus { outline: none; border-color: #10b981; }
  #gate button {
    width: 100%; padding: 12px;
    background: #10b981; color: #0a0e14;
    border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  #gate button:hover { background: #059669; }
  #gate .err { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }
  #gate .hint { color: #64748b; font-size: 12px; margin-top: 16px; text-align: center; }

  /* ============ Top Bar ============ */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    background: #1a2332;
    border-bottom: 1px solid #334155;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar h1 { font-size: 18px; font-weight: 600; color: #f1f5f9; }
  .topbar .meta {
    color: #94a3b8; font-size: 13px;
    display: flex; gap: 16px; align-items: center;
  }
  .topbar .meta .badge {
    padding: 4px 10px; background: #10b98120;
    color: #10b981; border-radius: 6px; font-size: 12px;
  }
  .topbar button.lock {
    background: transparent; border: 1px solid #334155;
    color: #94a3b8; padding: 4px 10px; border-radius: 6px;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }

  /* ============ Grid ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 20px; padding: 24px;
    max-width: 1400px; margin: 0 auto;
  }

  /* ============ Card ============ */
  .card {
    cursor: grab;
  }
  .card:active {
    cursor: grabbing;
  }
  .card .head {
    user-select: none;
  }
  .card.dragging {
    opacity: 0.4;
  }
  .card .drag-hint {
    position: absolute;
    top: 8px; right: 8px;
    color: #475569;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card:hover .drag-hint { opacity: 0.6; }
  .card {
    position: relative;
    background: #1a2332;
    border: 1px solid #334155;
    border-radius: 12px;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover { border-color: #475569; }
  .card .head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid #334155;
    background: #0f172a;
  }
  .card .head .title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #f1f5f9; }
  .card .head .title .icon { font-size: 18px; }
  .card .head .subtitle { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .card .head .actions { display: flex; gap: 6px; }
  .card .head .actions button {
    background: transparent; border: 1px solid #334155;
    color: #94a3b8; padding: 5px 10px; border-radius: 6px;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .card .head .actions button:hover { color: #e2e8f0; border-color: #475569; }
  .card .head .actions .drag-handle {
    background: #1e293b; border: 1px solid #475569;
    color: #cbd5e1; padding: 5px 10px; border-radius: 6px;
    font-size: 12px; cursor: grab; line-height: 1;
  }
  .card .head .actions .drag-handle:hover { background: #334155; color: #fff; }
  .card .head .actions .drag-handle:active { cursor: grabbing; background: #10b981; color: #fff; }

  /* KPI card styles */
  .card .body { padding: 18px; }
  .card .hero {
    text-align: center;
    padding: 12px 0 8px;
  }
  .card .hero .big {
    font-size: 36px; font-weight: 800;
    color: #10b981; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .card .hero .big.warn { color: #f59e0b; }
  .card .hero .big.danger { color: #ef4444; }
  .card .hero .label {
    font-size: 12px; color: #94a3b8;
    margin-top: 4px; text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .card .progress {
    height: 8px; background: #0f172a;
    border-radius: 4px; overflow: hidden;
    margin: 12px 0;
  }
  .card .progress .bar {
    height: 100%; background: linear-gradient(90deg, #10b981, #059669);
    transition: width 0.3s;
  }
  .card .progress .bar.warn { background: linear-gradient(90deg, #f59e0b, #d97706); }
  .card .progress .bar.danger { background: linear-gradient(90deg, #ef4444, #dc2626); }
  .card .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-top: 14px;
  }
  .card .kpi {
    background: #0f172a;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .card .kpi .k {
    font-size: 11px; color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .card .kpi .v {
    font-size: 16px; font-weight: 600;
    color: #f1f5f9;
    font-variant-numeric: tabular-nums;
  }
  .card .kpi .v.pos { color: #10b981; }
  .card .kpi .v.neg { color: #ef4444; }

  /* Index card style (for 桌面文件索引) */
  .card.index .body { padding: 0; max-height: 380px; overflow: auto; }
  .card.index .body ul { list-style: none; }
  .card.index .body li {
    padding: 8px 18px;
    border-bottom: 1px solid #334155;
    font-size: 13px;
  }
  .card.index .body li:last-child { border-bottom: none; }
  .card.index .body li .name { color: #cbd5e1; }
  .card.index .body li .meta { color: #64748b; font-size: 11px; margin-top: 2px; }

  /* iframe card (legacy, fallback) */
  .card.iframe .body { padding: 0; }
  .card.iframe iframe {
    width: 100%; height: 400px;
    border: none; display: block;
  }

  /* Empty state */
  .card .body.empty {
    color: #64748b; font-style: italic;
    text-align: center; padding: 40px 18px;
  }

  /* ============ Responsive ============ */
  @media (max-width: 767px) {
    .grid { grid-template-columns: 1fr; padding: 16px; gap: 14px; }
    .topbar { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
    .topbar h1 { font-size: 16px; }
    .topbar .meta { font-size: 12px; gap: 10px; }
    .card .head { padding: 12px 14px; }
    .card .body { padding: 14px; }
    .card .hero .big { font-size: 30px; }
    .card .kpi-grid { gap: 8px; }
  }
</style>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>🔒 Jay AI 工作台</h1>
    <p>请输入访问密码</p>
    <input type="password" id="pw" placeholder="密码" autofocus />
    <button onclick="unlock()">进入</button>
    <div class="err" id="err">密码错误</div>
    <div class="hint">私人聚合面板 · 密码存浏览器 localStorage</div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <h1>🚀 Jay · AI 工作台</h1>
    <div class="meta">
      <span id="clock"></span>
      <span class="badge" id="auth-status">🔓 已解锁</span>
      <button class="lock" onclick="lock()">锁屏</button>
    </div>
  </div>
  <div class="grid" id="grid">
    <div style="color:#94a3b8;text-align:center;padding:40px;">加载模块中…</div>
  </div>
</div>

<script>
const APP_PASSWORD = 'Yangjie326';
const STORAGE_KEY = 'ai_workbench_unlocked';

function unlock() {
  const pw = document.getElementById('pw').value;
  if (pw === APP_PASSWORD) {
    localStorage.setItem(STORAGE_KEY, '1');
    showApp();
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}
function lock() {
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('pw').value = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
}
function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderModules();
  startClock();
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
if (localStorage.getItem(STORAGE_KEY) === '1') showApp();

function startClock() {
  const el = document.getElementById('clock');
  function tick() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    el.textContent = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  tick();
  setInterval(tick, 1000);
}

// ============ Module Rendering ============
async function renderModules() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div style="color:#94a3b8;text-align:center;padding:40px;">加载模块中…</div>';

  let modules = [];
  try {
    const r = await fetch('modules.json', {cache: 'no-store'});
    modules = (await r.json()).modules || [];
  } catch (e) {
    grid.innerHTML = '<div style="color:#ef4444;text-align:center;padding:40px;">⚠️ 加载 modules.json 失败</div>';
    return;
  }

  // 优先用 localStorage 保存的用户自定义顺序
  const savedOrder = JSON.parse(localStorage.getItem('ai_workbench_order') || '[]');
  if (savedOrder.length) {
    modules.sort((a, b) => {
      const ai = savedOrder.indexOf(a.id);
      const bi = savedOrder.indexOf(b.id);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    });
  } else {
    modules.sort((a, b) => (a.order || 99) - (b.order || 99));
  }
  grid.innerHTML = '';
  for (const m of modules) {
    grid.appendChild(renderCard(m));
  }
  // 初始化拖拽排序
  if (window.Sortable) {
    Sortable.create(grid, {
      animation: 150,
      handle: '.drag-handle',
      ghostClass: 'dragging',
      onEnd: function(evt) {
        // 拖拽后保存新顺序到 localStorage
        const newOrder = [...grid.children].map(c => c.querySelector('[data-id]')?.dataset.id).filter(Boolean);
        localStorage.setItem('ai_workbench_order', JSON.stringify(newOrder));
        console.log('[拖拽] 新顺序已保存:', newOrder);
      }
    });
  }
}

function renderCard(m) {
  const card = document.createElement('div');
  card.className = 'card';
  const actionsHtml = `
    <div class="actions">
      <button class="drag-handle" title="按住拖动排序" onmousedown="event.stopPropagation()">⠿</button>
      <button onclick="refreshCard(this)" data-id="${m.id}" title="刷新">🔄</button>
      ${m.detailUrl ? `<button onclick="window.open('${m.detailUrl}','_blank')" title="详情页">↗</button>` : ''}
    </div>`;
  const headHtml = `<div class="head">
    <div>
      <div class="title"><span class="icon">${m.icon || '📦'}</span>${m.title}</div>
      ${m.subtitle ? `<div class="subtitle">${m.subtitle}</div>` : ''}
    </div>${actionsHtml}</div>`;
  card.insertAdjacentHTML('afterbegin', headHtml);

  const body = document.createElement('div');
  body.className = 'body';
  body.dataset.cardId = m.id;

  if (m.type === 'kpi') {
    body.innerHTML = '<div style="color:#94a3b8;text-align:center;padding:40px;">加载中…</div>';
    loadKpiData(m).then(data => {
      body.innerHTML = renderKpiBody(data);
    }).catch(e => {
      body.innerHTML = `<div class="empty">⚠️ 加载失败: ${escapeHtml(e.message || String(e))}</div>`;
    });
  } else if (m.type === 'iframe') {
    card.classList.add('iframe');
    body.innerHTML = `<iframe src="${m.src}" loading="lazy"></iframe>`;
  } else if (m.type === 'index') {
    card.classList.add('index');
    body.innerHTML = '<div style="color:#94a3b8;text-align:center;padding:20px;">加载中…</div>';
    loadIndexData(m).then(items => {
      body.innerHTML = `<ul>${items.map(it => `<li><div class="name">${escapeHtml(it.name)}</div><div class="meta">${escapeHtml(it.path || '')}${it.count ? ' · ' + it.count + ' 文件' : ''}</div></li>`).join('')}</ul>`;
    }).catch(e => {
      body.innerHTML = `<div class="empty">⚠️ ${escapeHtml(e.message)}</div>`;
    });
  } else {
    body.innerHTML = `<div class="empty">未知类型: ${m.type}</div>`;
  }
  card.appendChild(body);
  return card;
}

async function loadKpiData(m) {
  const h = {'cache': 'no-store'};
  // ngrok 隧道：加 skip 头避免浏览器拦截页（2026-08-12 修主界面KPI不显示）
  if (m.data.includes('ngrok-free.app')) h['ngrok-skip-browser-warning'] = '1';
  const r = await fetch(m.data, h);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return await r.json();
}
async function loadIndexData(m) {
  const h = {'cache': 'no-store'};
  if (m.data.includes('ngrok-free.app')) h['ngrok-skip-browser-warning'] = '1';
  const r = await fetch(m.data, h);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return await r.json();
}

function renderKpiBody(d) {
  // d = { hero: {value, label, color?}, progress?: {pct, color?}, kpis?: [{k, v, color?}] }
  let html = '';
  if (d.hero) {
    const colorCls = d.hero.color || '';
    html += `<div class="hero"><div class="big ${colorCls}">${escapeHtml(d.hero.value)}</div><div class="label">${escapeHtml(d.hero.label)}</div></div>`;
  }
  if (d.progress) {
    const pct = Math.max(0, Math.min(100, d.progress.pct || 0));
    const barCls = d.progress.color || '';
    html += `<div class="progress"><div class="bar ${barCls}" style="width:${pct}%"></div></div>`;
    if (d.progress.text) html += `<div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:-4px;">${escapeHtml(d.progress.text)}</div>`;
  }
  if (d.kpis && d.kpis.length) {
    html += '<div class="kpi-grid">';
    for (const k of d.kpis) {
      const vCls = k.color || '';
      html += `<div class="kpi"><div class="k">${escapeHtml(k.k)}</div><div class="v ${vCls}">${escapeHtml(k.v)}</div>${k.hint ? `<div class="khint">${escapeHtml(k.hint)}</div>` : ''}</div>`;
    }
    html += '</div>';
  }
  return html || '<div class="empty">无数据</div>';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function refreshCard(btn) {
  const card = btn.closest('.card');
  const id = btn.dataset.id;
  const body = card.querySelector('.body');
  body.innerHTML = '<div style="color:#94a3b8;text-align:center;padding:40px;">刷新中…</div>';
  fetch('modules.json', {cache: 'no-store'}).then(r => r.json()).then(d => {
    const m = d.modules.find(x => x.id === id);
    if (!m) return;
    if (m.type === 'kpi') {
      loadKpiData(m).then(data => { body.innerHTML = renderKpiBody(data); });
    } else if (m.type === 'index') {
      loadIndexData(m).then(items => {
        body.innerHTML = `<ul>${items.map(it => `<li><div class="name">${escapeHtml(it.name)}</div><div class="meta">${escapeHtml(it.path || '')}${it.count ? ' · ' + it.count + ' 文件' : ''}</div></li>`).join('')}</ul>`;
      });
    } else if (m.type === 'iframe') {
      const iframe = card.querySelector('iframe');
      iframe.src = iframe.src.split('?')[0] + '?t=' + Date.now();
    }
  });
}
</script>
</body>
</html>
